[tool.poetry]
name = "adk-vertex-memory-bank"
version = "0.1.0"
description = "Long-term agent memory in Google's Agent Development Kit, built for Vertex AI Agent Engine Memory Bank: a travel concierge that learns a user's preferences across sessions. The agent depends only on BaseMemoryService; one env var picks VertexAiMemoryBankService or a local, open-source Memory Bank look-alike on SQLite (LLM fact extraction, consolidation, per-user scopes, BM25 recall, TTL). Runs 100% locally on ollama."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/adk-vertex-memory-bank"
repository = "https://github.com/MartinCastroAlvarez/adk-vertex-memory-bank"
documentation = "https://github.com/MartinCastroAlvarez/adk-vertex-memory-bank#readme"
keywords = [
    "google-adk",
    "agent-development-kit",
    "vertex-ai",
    "memory-bank",
    "agent-engine",
    "agent-memory",
    "long-term-memory",
    "ai-agents",
    "ollama",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "travel_concierge" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
travel-concierge = "travel_concierge.cli:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
google-adk = ">=2.13,<3"
# The range google-adk[extensions] pins for its LiteLlm wrapper (ollama).
litellm = ">=1.84,<1.106.3"
pydantic = ">=2.12,<3"
# Security floor for a transitive dependency (CVE-2026-112907/-112913/-112940); it also keeps
# the resolver off litellm releases that cap filelock below 4.
filelock = ">=4.2.1"
# Only for CONCIERGE_MEMORY=vertex (your project, your bill): pip install "adk-vertex-memory-bank[vertex]".
google-cloud-agentplatform = { version = ">=2.2,<3", optional = true }

[tool.poetry.extras]
vertex = ["google-cloud-agentplatform"]

[tool.poetry.group.dev.dependencies]
# The Vertex adapter is tested against a fake client; the SDK is needed for its types only.
google-cloud-agentplatform = ">=2.2,<3"
pytest = "^9.0"
pytest-asyncio = ">=1.0,<2"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "E501"]
"examples/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["travel_concierge", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=travel_concierge",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # google.api_core (pulled in by the Vertex SDK) warns about Python 3.11's end of life.
    "ignore:You are using a Python version:FutureWarning",
    # The Vertex SDK's own types still use a pydantic pattern deprecated in 2.12.
    "ignore:Using `@model_validator` with mode='after' on a classmethod:DeprecationWarning",
]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["travel_concierge"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = ["travel_concierge/__main__.py"]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
